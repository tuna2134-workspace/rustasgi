[package]
name = "rustwasgi"
version = "0.1.0"
edition = "2024"

[lib]
name = "_rustwasgi"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
bytes = "1"
http-body = "1"
http-body-util = { version = "0.1", features = ["channel"] }
futures-util = "0.3"
tokio-tungstenite = "0.26"
tungstenite = "0.26"
